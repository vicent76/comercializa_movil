  <ion-toolbar>
    <ion-title>Foto</ion-title>
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <img [src]="imagen.src" alt="">
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

<ion-footer>
  <ion-toolbar>

    <div class="botonera-lineal">

      <button class="accion cerrar" (click)="dismiss()">
        <ion-icon name="close"></ion-icon>
        <span>Cerrar</span>
      </button>

    </div>

  </ion-toolbar>
</ion-footer>
