<app-header titulo="Parte detalle"></app-header>
<app-cabecera></app-cabecera>

<ion-content padding>
  <ion-list>
    <form name="frmParte" #fparte="ngForm" lines="none">

      <ion-item lines="none" class="grptitle ">
        <ion-grid fixed class="ion-text-center">
          <ion-row class="grptitle">
            <ion-col>
              <div>Parte</div>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Número:</ion-label>
        <ion-input [(ngModel)]="parteModificado.numParte" [ngModelOptions]="{standalone: false}" name="numParte"
          disabled></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Fecha reparación:</ion-label>
        <ion-input [value]="fechaFormateada" (click)="showDatepicker()" readonly>
        </ion-input>
        <ion-datetime #datetime displayFormat="DD/MM/YYYY" pickerFormat="DD/MM/YYYY" cancelText="Cancelar"
          doneText="Hecho" [(ngModel)]="parteModificado.fecha_reparacion" [ngModelOptions]="{ standalone: true }"
          (ionChange)="onDateChange($event)" style="display: none;"></ion-datetime>
      </ion-item>


      <ion-item>
        <ion-label position="stacked">Estado parte:</ion-label>
        <ion-select id="cmbEstadosParte" [(ngModel)]="parteModificado.estadoParteProfesionalId"
          [ngModelOptions]="{ standalone: false }" name="estadoParte" okText="Aceptar" cancelText="Cancelar"
          [disabled]="true" required>
          <ion-select-option *ngFor="let estado of estados" [value]="estado.estadoParteProfesionalId" [disabled]="estado.estadoParteProfesionalId === 2 || 
                         estado.estadoParteProfesionalId === 6 ||
                         estado.estadoParteProfesionalId === 7 ||
                         estado.estadoParteProfesionalId === 8">
            {{ estado.nombre }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Garantía:</ion-label>
        <ion-select id="cmbTiposGarantia" [(ngModel)]="parteModificado.tipoGarantiaId"
          [ngModelOptions]="{standalone: false}" name="tipoGarantia" okText="Aceptar" cancelText="Cancelar" required>
          <ion-select-option *ngFor="let tipoGarantia of tiposGarantia" [value]="tipoGarantia.tipoGarantiaId">
            {{tipoGarantia.nombre}}
          </ion-select-option>
        </ion-select>
      </ion-item>


      <ion-item>
        <ion-label position="stacked">Descripción avería:</ion-label>
        <ion-textarea maxlength="500" autoGrow="true" [(ngModel)]="parteModificado.descripcion_averia"
          name="descripcion_averia" type="text" disabled>
        </ion-textarea>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Reparación realizada:</ion-label>
        <ion-textarea maxlength="500" [(ngModel)]="parteModificado.trabajos_realizados"
          [ngModelOptions]="{standalone: false}" name="trabajos_realizados" type="text" autoGrow="true" required>
        </ion-textarea>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Observaciones:</ion-label>
        <ion-textarea maxlength="500" [(ngModel)]="parteModificado.observacionesDelProfesional"
          [ngModelOptions]="{standalone: false}" name="observacionesDelProfesional" type="text" autoGrow="true">
        </ion-textarea>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Trabajos pendientes:</ion-label>
        <ion-textarea maxlength="500" [(ngModel)]="parteModificado.trabajosPendientes"
          [ngModelOptions]="{standalone: false}" name="trabajosPendientes" type="text" autoGrow="true">
        </ion-textarea>
      </ion-item>
    </form>
  </ion-list>
</ion-content>
<ion-toolbar>
  <div class="botonera-lineal">

    <button class="accion presupuesto" (click)="openFrmPresupuesto()">
      <ion-icon name="cash-outline"></ion-icon>
      <span>Presupuesto</span>
    </button>

    <button class="accion salir" (click)="cancelar()">
      <ion-icon name="close"></ion-icon>
      <span>Salir</span>
    </button>

    <button class="accion guardar"
      *ngIf="confirmado == 1 && (parte.estadoParteProfesionalId != 2 && parte.estadoParteProfesionalId != 6 && parte.estadoParteProfesionalId != 8)"
      (click)="submit()">
      <ion-icon name="checkbox"></ion-icon>
      <span>Guardar</span>
    </button>

  </div>
</ion-toolbar>
<app-footer></app-footer>
